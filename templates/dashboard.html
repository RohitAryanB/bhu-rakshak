<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhoomiRakshak — Mine Subsidence Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">भू</span>
    <div class="brand-text">
      <h1>BhoomiRakshak-test</h1>
      <p>Wireless Surface Mesh — Mine Subsidence Early Warning</p>
    </div>
  </div>
  <div class="topbar-right">
    <div id="system-clock" class="clock">--:--:--</div>
    <div id="overall-banner" class="overall-banner normal">SYSTEM NORMAL</div>
  </div>
</header>

<main>

  <section id="alert-banner-region"></section>

  <section class="node-grid" id="node-grid">
    <!-- node cards injected by JS -->
  </section>

  <section class="panels">

    <div class="panel chart-panel">
      <div class="panel-head">
        <h2>Deformation Trend</h2>
        <select id="chart-node-select"></select>
      </div>
      <canvas id="trendChart" height="110"></canvas>
    </div>

    <div class="panel map-panel">
      <div class="panel-head">
        <h2>Zone Layout</h2>
      </div>
      <div id="zone-map"></div>
    </div>

  </section>

  <section class="panels">

    <div class="panel alerts-panel">
      <div class="panel-head">
        <h2>Alert Log</h2>
        <button id="export-btn" class="ghost-btn">Export CSV</button>
      </div>
      <div id="alerts-list" class="alerts-list"></div>
    </div>

    <div class="panel demo-panel">
      <div class="panel-head">
        <h2>Demo Controls</h2>
      </div>
      <p class="demo-note">Simulate a deformation event for presentation purposes.</p>
      <div class="demo-buttons">
        <button class="demo-btn n1" data-node="N1">Trigger Event — N1</button>
        <button class="demo-btn n2" data-node="N2">Trigger Event — N2</button>
        <button class="demo-btn reset" id="reset-demo">Reset All</button>
      </div>
    </div>

  </section>

</main>

<div id="note-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Acknowledge Alert</h3>
    <textarea id="note-text" placeholder="Add inspection note (optional)"></textarea>
    <div class="modal-actions">
      <button id="note-cancel" class="ghost-btn">Cancel</button>
      <button id="note-confirm" class="primary-btn">Acknowledge</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
